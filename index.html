const topics={ratios:{name:'Ratios & Proportions',questions:[{q:'A recipe uses 2 cups of water for 1 cup of rice. How many cups of water for 3 cups of rice?',a:['3 cups','6 cups','9 cups'],correct:1,hint:'Think about repeating the 2-to-1 relationship three times.'},{q:'Which pair is equivalent to 3:4?',a:['6:8','6:7','9:10'],correct:0,hint:'Multiply both parts by the same number.'},{q:'A map uses 1 cm for 5 km. What does 4 cm represent?',a:['9 km','20 km','25 km'],correct:1,hint:'Each centimeter represents five kilometers.'},{q:'A shirt costs $20 and is discounted by 25%. What is the sale price?',a:['$5','$15','$18'],correct:1,hint:'Find one quarter of $20, then subtract it.'}],lessons:{simple:'A ratio compares two amounts. If you use 2 cups of water for every 1 cup of rice, you can double both amounts to make 4 cups of water and 2 cups of rice.',standard:'Ratios describe multiplicative relationships. Equivalent ratios are created by multiplying or dividing both terms by the same nonzero factor. For example, 2:3 and 4:6 are equivalent.',advanced:'Proportional relationships have a constant of proportionality k. When y=kx, the ratio y/x remains constant for nonzero x. This connects ratio tables, graphs through the origin, and unit rates.'},prompts:['What stays the same when you scale both parts of a ratio?','How could you check whether two ratios are equivalent?']},energy:{name:'Cellular Energy & Photosynthesis',questions:[{q:'What is the main energy source for photosynthesis?',a:['Sunlight','Soil','Wind'],correct:0,hint:'Think about what reaches the leaves during the day.'},{q:'Which gas do plants take in during photosynthesis?',a:['Oxygen','Carbon dioxide','Helium'],correct:1,hint:'This gas is also released when animals breathe out.'},{q:'Which part of plant cells contains chlorophyll?',a:['Nucleus','Chloroplast','Cell membrane'],correct:1,hint:'Look for the organelle that captures light.'},{q:'Which product of photosynthesis stores chemical energy?',a:['Glucose','Sand','Nitrogen'],correct:0,hint:'Plants make a sugar that stores energy.'}],lessons:{simple:'Plants use light, water, and carbon dioxide to make sugar. This process is called photosynthesis. Oxygen is also released.',standard:'In photosynthesis, chloroplasts capture light energy and use it to convert carbon dioxide and water into glucose and oxygen. Glucose stores chemical energy.',advanced:'Photosynthesis includes light-dependent reactions that capture energy and the Calvin cycle that fixes carbon into sugars. The overall process transforms light energy into stored chemical energy.'},prompts:['What inputs does a plant need for photosynthesis?','How is light energy connected to the sugar a plant makes?']},water:{name:'Water Cycle & Watersheds',questions:[{q:'What is evaporation?',a:['Liquid water turning into vapor','Rain falling','Water freezing'],correct:0,hint:'Think about a puddle disappearing on a sunny day.'},{q:'What process forms clouds as water vapor cools?',a:['Runoff','Condensation','Infiltration'],correct:1,hint:'Vapor becomes tiny liquid droplets.'},{q:'What is a watershed?',a:['A type of cloud','Land draining to a common water body','Only an underground lake'],correct:1,hint:'Think about where rainwater flows after landing on a hillside.'},{q:'What is infiltration?',a:['Water entering soil','Water falling as snow','Water boiling'],correct:0,hint:'The water moves down into the ground.'}],lessons:{simple:'Water moves around Earth. It evaporates into the air, forms clouds, falls as rain or snow, and flows over or into the ground.',standard:'The water cycle includes evaporation, condensation, precipitation, runoff, and infiltration. A watershed is an area of land that drains to a shared outlet.',advanced:'Watershed hydrology describes how precipitation is partitioned into evapotranspiration, surface runoff, infiltration, and groundwater flow. Land cover influences these pathways.'},prompts:['Where might rainwater travel after it reaches the ground?','How could pavement change the amount of runoff?']}};

 reading:{name:'Reading Comprehension & Evidence',subject:'English Language Arts',questions:[{q:'Maya planted seeds. She watered them daily. What did Maya do every day?',a:['Painted the seeds','Watered the seeds','Moved the seeds'],correct:1,hint:'Look for the action described as daily.'},{q:'A passage says the library closes at six. Which statement is supported?',a:['It closes at six','It opens at six','It never closes'],correct:0,hint:'Find the sentence with the closing time.'},{q:'A character packs a coat because dark clouds are gathering. What can you infer?',a:['They expect cold or rain','They are going swimming','They lost a coat'],correct:0,hint:'Think about why someone might bring a coat.'},{q:'Which detail best supports the claim that a garden attracts pollinators?',a:['The fence is brown','Bees visited its flowers','The path is paved'],correct:1,hint:'Find evidence involving pollinating animals.'}],lessons:{simple:'Readers find clues in a passage. A detail is something the text tells us. Read a short part, then ask: what happened?',standard:'Good readers distinguish explicit details from inferences. An inference combines textual evidence with what you already know.',advanced:'Evaluate claims by identifying relevant, sufficient textual evidence, considering context and distinguishing inference from unsupported speculation.'},prompts:['Which words in the passage support your idea?','What is stated directly, and what must you infer?']},
 civics:{name:'Civics, Geography & History',subject:'Social Studies',questions:[{q:'Which map feature explains symbols?',a:['Legend or key','Border','Scale only'],correct:0,hint:'Look for the box that explains icons.'},{q:'What is a primary source?',a:['A summary written later','A diary written by a witness','A modern textbook'],correct:1,hint:'Who was present when the event happened?'},{q:'Which branch of US government interprets laws?',a:['Judicial','Legislative','Executive'],correct:0,hint:'Think about courts.'},{q:'Why should historians compare multiple accounts?',a:['To ignore evidence','To check perspectives and reliability','To choose the longest story'],correct:1,hint:'Different observers can have different viewpoints.'}],lessons:{simple:'Maps show places. A map key explains symbols. We can learn about the past from pictures, objects, and stories.',standard:'Historians use primary and secondary sources. Citizens participate in communities and government, and maps help explain geographic relationships.',advanced:'Historical reasoning compares evidence, contextualizes sources, evaluates bias, and explains how institutions distribute power and responsibilities.'},prompts:['Who created this source and why?','What evidence could confirm this claim?']},
 computing:{name:'Algorithms & Computer Science',subject:'Computer Science',questions:[{q:'What is an algorithm?',a:['A sequence of steps','A computer screen','A battery'],correct:0,hint:'Think of instructions for making a sandwich.'},{q:'What does a loop do in a program?',a:['Repeats steps','Deletes the keyboard','Stops electricity'],correct:0,hint:'Think about doing something again.'},{q:'A condition says IF it rains THEN bring an umbrella. What happens when it rains?',a:['Bring an umbrella','Ignore the condition','Turn off the sun'],correct:0,hint:'Follow the THEN instruction.'},{q:'Why do programmers test their code?',a:['To find and fix errors','To make it longer','To avoid checking results'],correct:0,hint:'What happens if the program does something unexpected?'}],lessons:{simple:'An algorithm is a list of steps. Computers follow instructions in order. We can test whether the steps work.',standard:'Programs use sequences, loops, and conditionals to solve problems. Testing and debugging help verify expected behavior.',advanced:'Algorithm design balances correctness, efficiency, decomposition, abstraction, and testing against representative and edge-case inputs.'},prompts:['Can you describe your algorithm step by step?','Which test case might reveal a mistake?']},
 fractions:{name:'Fractions & Number Sense',subject:'Mathematics',questions:[{q:'What is half of 8?',a:['2','4','6'],correct:1,hint:'Split eight into two equal groups.'},{q:'Which fraction is equal to one half?',a:['2/4','1/3','3/4'],correct:0,hint:'Divide the top and bottom by the same number.'},{q:'What is 1/4 + 1/4?',a:['1/8','2/4','2/8'],correct:1,hint:'The pieces have the same size, so add their counts.'},{q:'Which is greater?',a:['3/4','1/2','They are equal'],correct:0,hint:'Imagine four equal parts and compare.'}],lessons:{simple:'A fraction describes equal parts of a whole. One half means one of two equal parts.',standard:'Equivalent fractions name the same amount. When denominators match, add or subtract numerators while keeping the denominator.',advanced:'Fractions are rational numbers; equivalence and operations follow from properties of number systems and proportional reasoning.'},prompts:['Can you draw equal parts?','How could you show that two fractions are equivalent?']},

 tn:{name:'Tennessee Academic Standards',status:'Official Tennessee standards sources',links:[['Tennessee academic standards hub','https://www.tn.gov/education/districts/academic-standards.html'],['Tennessee mathematics standards','https://www.tn.gov/education/districts/academic-standards/mathematics-standards.html.html'],['Tennessee science standards','https://www.tn.gov/sbe/committees-and-initiatives/standards-review/science.html'],['Tennessee English language arts standards','https://www.tn.gov/sbe/committees-and-initiatives/standards-review/english-language-arts.html'],['Tennessee social studies standards','https://www.tn.gov/sbe/committees-and-initiatives/standards-review/social-studies.html'],['Tennessee K–12 computer science standards','https://www.tn.gov/content/dam/tn/education/ccte/cte/K12TennesseeComputerScienceStandards.pdf']],notes:'Math standards implemented 2023–24; science standards implemented 2025–26; revised social studies standards begin 2027–28; revised ELA standards begin 2029–30. Review the official documents before assigning a specific benchmark.'},

const $=x=>document.getElementById(x), t=k=>(translations[s.language]||translations.en)[k]||translations.en[k], save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}, options=(obj,val)=>Object.entries(obj).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v}</option>`).join(''), notify=msg=>{$('live').textContent=msg}, btn=(label,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;
function tab(name){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));render(name)}window.tab=tab;
function field(label,id,obj,val){return `<label for="${id}">${label}</label><select id="${id}" onchange="set('${id}',this.value)">${options(obj,val)}</select>`}window.set=(key,value)=>{s[key]=value;if(key==='subject'){s.topic=Object.keys(topics).find(k=>value==='All Subjects'||topics[k].subject===value)||'ratios';s.answers=[];s.step=0;s.assessmentTopic=null;}if(key==='grade'){s.complexity=(value==='K-2'||value==='3-5')?'simple':value==='11-12'?'advanced':'standard'}save();let active=document.querySelector('nav button.active').dataset.tab;render(active)};
function controls(){return `<div class="card"><h2>K–12 Learning preferences</h2><div class="grid"><div>${field('Grade level','grade',{'K-2':'Kindergarten–Grade 2','3-5':'Grades 3–5','6-8':'Grades 6–8','9-10':'Grades 9–10','11-12':'Grades 11–12'},s.grade)}</div><div>${field('Subject','subject',Object.fromEntries(subjects.map(x=>[x,x])),s.subject)}</div><div>${field('Learning topic','topic',Object.fromEntries(Object.entries(topics).filter(([k,v])=>s.subject==='All Subjects'||v.subject===s.subject).map(([k,v])=>[k,v.name])),s.topic)}</div><div>${field('Interface language','language',languages,s.language)}</div><div>${field('Standards framework','framework',standards,s.framework)}</div></div><p class="muted">Tennessee is the default. Open Standards Library for official source documents. Coverage is a growing sample library across K–12 subjects, not a complete K–12 curriculum. Exact benchmark alignment is not yet verified; lesson translations are partial.</p></div>`}
function home(){return `<section class="card"><h2>${t('welcome')}</h2><p>${t('intro')}</p><p><span class="pill">Untimed checks</span><span class="pill">Read aloud</span><span class="pill">Private local progress</span></p>${btn(t('start'),"tab('check')",'primary')} ${btn(t('learn'),"tab('learn')")}</section>${controls()}<div class="grid"><div class="card"><h3>1. Discover</h3><p>Answer four untimed questions; the next question adjusts to your accuracy and confidence.</p></div><div class="card"><h3>2. Learn</h3><p>Read a lesson at a level that fits your current needs.</p></div><div class="card"><h3>3. Grow</h3><p>Try hints, practice again, and track your progress privately.</p></div></div>`}
function assessment(){let q=topics[s.topic].questions;if(s.assessmentTopic!==s.topic){s.assessmentTopic=s.topic;s.answers=[];s.step=0;s.challenge=1;save()}if(s.step>=q.length)return result();let idx=s.answers[s.step]?.questionIndex??Math.min(q.length-1,Math.max(0,s.challenge+(s.step===0?0:0)));let item=q[idx],a=s.answers[s.step]||{};return `<div class="card"><h2>${t('assessment')} — ${topics[s.topic].name}</h2><p>${t('untimed')}</p><p><strong>Question ${s.step+1} of ${q.length}</strong> · Adaptive challenge level ${s.challenge+1} of 4</p><progress value="${s.step}" max="${q.length}"></progress><h3>${item.q}</h3><div role="group" aria-label="Answer choices">${item.a.map((x,i)=>`<button class="answer ${a.choice===i?'chosen':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><label for="comfort">How did this question feel?</label><select id="comfort" onchange="comfort(this.value)">${options({'':'Choose one','clear':'Clear to me','unsure':'A bit unsure','support':'Needed extra support'},a.comfort||'')}</select><p>${btn('Hear question',"speakQuestion()")}</p><div id="questionFeedback" aria-live="polite"></div><p>${btn(s.step===q.length-1?t('finish'):t('next'),'advance()','primary')}</p></div>`}window.choose=i=>{s.answers[s.step]={...s.answers[s.step],choice:i,questionIndex:s.answers[s.step]?.questionIndex??Math.min(topics[s.topic].questions.length-1,Math.max(0,s.challenge))};save();render('check')};window.comfort=v=>{s.answers[s.step]={...s.answers[s.step],comfort:v};save()};window.advance=()=>{let a=s.answers[s.step];if(!a||a.choice===undefined||!a.comfort){$('questionFeedback').innerHTML='<div class="status warn">Please select an answer and a comfort level before continuing.</div>';return}let q=topics[s.topic].questions[a.questionIndex??s.step];s.challenge=Math.max(0,Math.min(3,s.challenge+(a.choice===q.correct&&a.comfort==='clear'?1:(a.choice!==q.correct||a.comfort==='support'?-1:0))));s.step++;save();render('check')};window.speakQuestion=()=>speak(topics[s.topic].questions[s.step].q);
function placement(answers,topic){let correct=answers.filter((a,i)=>a.choice===topics[topic].questions[a.questionIndex??i].correct).length;let uncertain=answers.filter(a=>a.comfort!=='clear').length;let level=correct<=1?'Foundation':correct===2?'Core':correct===3?'Stretch':'Enrichment';if(correct===4&&uncertain>=2)level='Stretch';return {correct,uncertain,level}};
function result(){let p=placement(s.answers,s.topic);s.progress[s.topic]={...p,grade:s.grade,framework:s.framework,date:new Date().toLocaleDateString(),answers:s.answers};save();return `<div class="card"><h2>Your learning map</h2><p class="muted">Adaptive questions were selected based on previous answers and comfort. This is a flexible starting recommendation, not a diagnosis or formal proficiency score.</p><h3>${topics[s.topic].name}: ${p.level}</h3><p>You answered ${p.correct} of 4 correctly. You reported uncertainty or a need for support on ${p.uncertain} question(s).</p><div class="status">${p.level==='Foundation'?'Start with simple examples and build confidence one step at a time.':p.level==='Core'?'Review the main ideas and practice a few more examples.':p.level==='Stretch'?'You are ready for some challenging practice, with room to revisit confusing steps.':'You may be ready to extend your learning with deeper questions.'}</div>${btn('Go to my lesson',"tab('learn')",'primary')} ${btn('Try check again','restart()')}</div>`}window.restart=()=>{s.answers=[];s.step=0;s.challenge=1;save();render('check')};
function lesson(){let topic=topics[s.topic],p=s.progress[s.topic],recommended=p?(p.level==='Foundation'?'simple':p.level==='Enrichment'?'advanced':'standard'):s.complexity;return `${controls()}${standardsPanel()}<div class="card"><h2>Learning Studio: ${topic.name}</h2><p class="muted">Suggested level: ${p?p.level:'Not yet assessed'} • ${standards[s.framework]}</p>${field('Lesson complexity','complexity',{simple:'Simplified',standard:'Standard',advanced:'Accelerated'},s.complexity)}<p class="muted">${p?'Based on your most recent check, consider '+recommended+' complexity.':'You can take an adaptive check to receive a starting recommendation.'}</p><div id="lessonText"><h3>Explore the concept</h3><p>${topic.lessons[s.complexity]}</p></div><div class="toolbar">${btn('🔊 Read lesson','speakLesson()')} ${btn('⏹ Stop audio','stopSpeech()')}</div></div><div class="card"><h2>Guided tutor</h2><p class="muted">Offline rule-based guide — not a generative AI. It asks questions and offers hints using the built-in lesson content.</p><div id="messages" aria-live="polite">${s.history.filter(x=>x.topic===s.topic).slice(-8).map(x=>`<p class="${x.from==='You'?'student':''}"><strong>${x.from}:</strong> ${escapeHtml(x.text)}</p>`).join('')}</div><label for="tutorInput">What are you wondering about?</label><textarea id="tutorInput" placeholder="For example: I don't understand this idea yet."></textarea><p>${btn('Ask for guidance','askTutor()','primary')} ${btn('Give me a hint','hintTutor()')}</p><p><strong>Try thinking about:</strong> ${topic.prompts[0]}</p></div>`}window.speakLesson=()=>speak(topics[s.topic].lessons[s.complexity]);window.stopSpeech=()=>{if('speechSynthesis'in window)speechSynthesis.cancel()};
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tutorReply(text){let q=text.toLowerCase(),topic=topics[s.topic];if(/answer|solve|tell me what/.test(q))return 'I can guide you rather than simply give an answer. '+topic.questions[0].hint+' What step would you try first?';if(/confus|don't|dont|hard|help|stuck|understand/.test(q))return 'That is a good place to begin. '+topic.questions[0].hint+' Can you explain what you already know in your own words?';if(/example|practice/.test(q))return 'Try this practice question: '+topic.questions[1].q+' Think it through, and tell me how you approached it.';return 'Let’s explore that together. '+topic.prompts[(s.history.length)%topic.prompts.length]+' What is your first idea?'}window.askTutor=()=>{let v=$('tutorInput').value.trim();if(!v)return;v=v.slice(0,500);s.history.push({from:'You',text:v,topic:s.topic},{from:'AAAT',text:tutorReply(v),topic:s.topic});s.history=s.history.slice(-40);save();render('learn')};window.hintTutor=()=>{s.history.push({from:'AAAT',text:topics[s.topic].questions[0].hint+' What would you try next?',topic:s.topic});save();render('learn')};
function progress(){return `<div class="card"><h2>My Progress</h2><p>Progress stays in this browser on this device. It is not uploaded to a server.</p>${Object.entries(topics).map(([k,v])=>{let p=s.progress[k];return `<div class="card"><h3>${v.name}</h3>${p?`<p><strong>${p.level}</strong> • ${p.correct}/4 correct • ${p.date}</p><p>${p.uncertain} question(s) felt uncertain or needed extra support.</p>`:'<p class="muted">No check completed yet.</p>'}${btn('Practice this topic',`setTopicAndGo('${k}')`)}</div>`}).join('')}</div>`}window.setTopicAndGo=k=>{s.topic=k;save();tab('learn')};
function standardsView(){return `${controls()}${standardsPanel()}`};
function settings(){return `<div class="card"><h2>Accessibility & Privacy</h2><div class="grid"><div>${field('Text size','size',{normal:'Standard',large:'Large',largest:'Extra large'},s.size)}</div><div>${field('Reading surface','tint',{off:'Off-white',cream:'Warm cream',sage:'Soft sage',dark:'Calm dark'},s.tint)}</div><div>${field('Reading spacing','spacing',{'false':'Standard','true':'Extra spacing'},String(s.spacing))}</div><div>${field('Line focus','focus',{'false':'Off','true':'Highlight hovered paragraphs'},String(s.focus))}</div><div>${field('Read-aloud speed','speed',{'0.85':'0.85×','1':'1×','1.15':'1.15×'},s.speed)}</div></div><p>${btn('Read a sample','speakSample()')} ${btn('Stop audio','stopSpeech()')}</p><p class="muted">Read aloud uses your device's built-in speech voices. Available voices and languages depend on your browser and operating system.</p></div>${controls()}<div class="card"><h2>Privacy controls</h2><p>No sign-in, analytics, third-party AI calls, or server database are included. Learning preferences and progress are stored only in this browser using localStorage. On shared devices, other users of this browser profile may see them.</p><p>Do not enter student names, disability diagnoses, personal contact details, or other sensitive information in the tutor.</p>${btn('Erase all saved progress and preferences','erase()','danger')}</div><div class="card"><h2>Responsible AI and standards</h2><p>This is an educational prototype, not a special education evaluation, dyslexia screening, or substitute for teacher judgment. Framework names are selectable references only; no claim of verified item-by-item curriculum alignment is made. Tutor responses are pre-programmed and do not independently verify student reasoning.</p></div>`}window.speakSample=()=>speak('Welcome to AAAT. Learn at your pace. Grow with confidence.');window.erase=()=>{if(confirm('Erase all AAAT progress and settings saved in this browser?')){localStorage.removeItem(KEY);s={...defaults,progress:{},answers:[],history:[]};tab('home')}};
function speak(text){if(!('speechSynthesis'in window)){alert('Speech is not supported in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang={en:'en-US',es:'es-ES',fr:'fr-FR',zh:'zh-CN',ar:'ar-SA'}[s.language];u.rate=Number(s.speed);speechSynthesis.speak(u)};
function render(name){if(typeof s.spacing==='string')s.spacing=s.spacing==='true';if(typeof s.focus==='string')s.focus=s.focus==='true';document.body.className=[s.size,s.tint,s.spacing?'spaced':'',s.focus?'focus':''].join(' ');document.documentElement.lang=s.language;document.documentElement.dir=s.language==='ar'?'rtl':'ltr';$('app').innerHTML=({home,check:assessment,learn:lesson,progress,standards:standardsView,settings})[name]();}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));tab('home');
</script></body></html>
